<nav class="navbar navbar-expand-lg bg-body-tertiary"> <!-- navbar: base navbar container; navbar-expand-lg: responsive expansion on large screens; bg-body-tertiary: background color -->
  <div class="container-fluid"> <!-- full width container -->

    <a class="navbar-brand" href="#">BrandName</a> <!-- navbar-brand: brand/logo styling -->

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation"> <!-- navbar-toggler: hamburger menu button -->
      <span>-</span> <!-- navbar-toggler-icon: icon inside toggler -->
    </button>

    <div class="collapse navbar-collapse" id="navbarContent"> <!-- collapse: collapsible container; navbar-collapse: styling for collapsible navbar content -->

      <ul class="navbar-nav me-auto mb-2 mb-lg-0"> <!-- navbar-nav: container for nav items; me-auto pushes items left; spacing for small/large screens -->

        <li class="nav-item"> <!-- nav-item: individual nav item -->
          <a class="nav-link active" aria-current="page" href="#">Home</a> <!-- nav-link: nav link styling; active: highlight current page -->
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">Link</a> <!-- nav-link: nav link styling -->
        </li>

        <li class="nav-item dropdown"> <!-- nav-item: individual nav item; dropdown: container for dropdown menu -->
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"> <!-- nav-link: nav link styling; dropdown-toggle: toggles dropdown -->
            Dropdown
          </a>
          <ul class="dropdown-menu"> <!-- dropdown-menu: container for dropdown items -->
            <li><a class="dropdown-item" href="#">Action</a></li> <!-- dropdown-item: individual dropdown link -->
            <li><a class="dropdown-item" href="#">Another action</a></li>
            <li><hr class="dropdown-divider"></li> <!-- dropdown-divider: horizontal divider -->
            <li><a class="dropdown-item" href="#">Something else</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Disabled</a> <!-- nav-link: nav link styling; disabled: makes link unclickable -->
        </li>

      </ul>

      <form class="d-flex" role="search"> <!-- d-flex: flex container for horizontal layout -->
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"> <!-- form-control: input styling; me-2: margin end spacing -->
        <button class="btn btn-outline-success" type="submit">Search</button> <!-- btn: base button; btn-outline-success: green outline button -->
      </form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')
    const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl))
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
    const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
</script>
